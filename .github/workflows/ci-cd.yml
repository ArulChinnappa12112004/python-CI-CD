name: Python CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest

  build-and-package:

    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t calculator-app:${{ github.run_number }} .
          docker tag calculator-app:${{ github.run_number }} calculator-app:latest

      - name: Verify Docker Image
        run: |
          docker images

  deploy:

    needs: build-and-package

    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application
        run: |
          echo "Deploying Application..."
          echo "Application Deployed Successfully"