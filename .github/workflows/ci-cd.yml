name: Python CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest

  sonarcloud:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    needs: sonarcloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/calculator-app:${{ github.run_number }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/calculator-app:${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/calculator-app:latest

      - name: Verify Docker Image
        run: docker images

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/calculator-app:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/calculator-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application
        run: |
          echo "Pulling image from Docker Hub..."
          echo "Deploying calculator-app..."
          echo "Deployment Successful"